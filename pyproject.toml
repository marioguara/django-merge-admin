[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-merge-admin"
version = "0.2.0"
description = "Reusable Django admin mixin to safely merge two or more model records, re-parenting all related data to the chosen surviving record."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "Mario Guara" }]
keywords = ["django", "admin", "merge", "deduplication", "mixin"]
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 3.2",
    "Framework :: Django :: 4.0",
    "Framework :: Django :: 4.1",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["Django>=3.2"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-django>=4"]

[project.urls]
Homepage = "https://github.com/marioguara/django-merge-admin"
Source = "https://github.com/marioguara/django-merge-admin"
Issues = "https://github.com/marioguara/django-merge-admin/issues"

[tool.setuptools.packages.find]
include = ["merge_admin*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
merge_admin = ["templates/**/*.html", "static/**/*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]
addopts = "-ra"
